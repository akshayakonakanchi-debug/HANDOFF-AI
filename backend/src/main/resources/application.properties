# Render supplies PORT. Locally this falls back to 8080.
server.port=${PORT:8080}
server.servlet.context-path=/api

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Demo database: no MySQL installation is required.
spring.datasource.url=jdbc:h2:mem:handoffai;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# Set this in Render to the exact Vercel URL, for example:
# APP_CORS_ALLOWED_ORIGINS=https://handoff-ai.vercel.app
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging.level.root=INFO
logging.level.com.handoffai=INFO
app.name=HANDOFF AI
app.version=1.0.0
